<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form id="feedbackForm" onsubmit="event.preventDefault(); saveFeedback();">

        <label>Student Name</label><br>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>

        <label>Email</label><br>
        <input type="email" id="email">
        <p id="emailError" class="error"></p>

        <label>Course</label><br>
        <select id="course">
            <option value="">Select Course</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
        <p id="courseError" class="error"></p>

        <label>Feedback</label><br>
        <textarea id="feedback"></textarea>
        <p id="feedbackError" class="error"></p>

        <br>

        <button type="submit">Submit Feedback</button>
        <button type="button" onclick="deleteData()">Delete Stored Data</button>

    </form>

    <h2 id="sessionUser"></h2>

    <h2>Stored Feedback</h2>

    <div id="storedData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
